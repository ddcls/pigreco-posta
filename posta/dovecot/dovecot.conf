# Dovecot della copia locale: sostituisce l'intera configurazione di Debian.
# Gli utenti (uno per casella, nome = indirizzo email) sono generati da
# /srv/posta/config/account.conf all'avvio e dalla pagina di gestione:
# Dovecot rilegge da solo il file quando cambia, senza riavvio.

protocols = imap
listen = *

log_path = /dev/stderr
info_log_path = /dev/stdout

# --- Autenticazione: solo utenti di posta, nessun utente di sistema ---
auth_mechanisms = plain login
# Password in chiaro solo dentro TLS (SSL sulla 993 o STARTTLS sulla 143)
disable_plaintext_auth = yes

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /srv/posta/config/generati/caselle.passwd
}
userdb {
  driver = passwd-file
  args = username_format=%u /srv/posta/config/generati/caselle.passwd
  default_fields = uid=vmail gid=vmail
}
# Il file utenti sta in /srv/posta (gruppo vmail): l'autenticazione gira come
# utente dovecot e ha bisogno del gruppo per leggerlo
service auth {
  extra_groups = vmail
}

# --- Caselle: /srv/posta/<indirizzo>/Maildir ---
mail_location = maildir:~/Maildir
first_valid_uid = 5000
last_valid_uid = 5000

# Su disco le sottocartelle sono Maildir++ (.Archivio.2018, come le scrive
# mbsync), ai programmi si mostrano con "/" (Archivio/2018): così un punto
# nel nome di una cartella del gestore non diventa una sottocartella.
namespace inbox {
  inbox = yes
  separator = /

  # Cartelle speciali (RFC 6154), riconosciute dalla webmail e dai telefoni
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}

# --- TLS: certificato in /srv/posta/config/ssl (creato al primo avvio) ---
ssl = yes
ssl_cert = </srv/posta/config/ssl/cert.pem
ssl_key = </srv/posta/config/ssl/key.pem
ssl_min_protocol = TLSv1.2

protocol imap {
  mail_max_userip_connections = 20
}
