<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # PiGreco Posta sotto /webmail/ (lo stesso percorso con cui la pubblica
    # PiGreco Archivio quando è collegato); la radice porta lì
    RedirectMatch 302 ^/$ /webmail/
    Alias /webmail /var/www/webmail
    Alias /favicon.ico /var/www/webmail/favicon.ico

    # Come sui server Debian di default, i .htaccess della webmail non sono
    # letti (AllowOverride None): le protezioni sono qui sotto.
    <Directory /var/www/webmail>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    # File nascosti, script da riga di comando e cartelle di soli include
    # (classi, configurazione, PHPMailer): mai richiesti dal browser
    <LocationMatch "^/webmail/(.*/)?(\.|initializa/|migrations/|lib/|config/|phpmailer/)">
        Require all denied
    </LocationMatch>
    <FilesMatch "\.(md|sql|py|sh|txt|json|bak|log|example)$">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    # La webmail non si può mettere dentro pagine di altri siti (clickjacking)
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Content-Security-Policy "frame-ancestors 'self'"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    ServerSignature Off
</VirtualHost>
